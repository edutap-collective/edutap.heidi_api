name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nothing here is locked: uv.lock is deliberately git-ignored and every
  # requirement is a lower bound. A suite that passed last week can fail today
  # with nothing changed here.
  schedule:
    - cron: "17 5 * * 1"
  # Callable, so the release workflow runs *these* checks rather than its own
  # copy. A release gate that restates the checks drifts from them, and it
  # drifts silently, because nobody reads two files side by side.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Test
        run: pytest -m "not integration and not drift"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Type check
        run: ty check

[tox]
env_list = py312, py313, py314, lint
isolated_build = true

[testenv]
runner = uv-venv-lock-runner
extras = dev
commands = pytest -m "not integration and not drift" {posargs}

[testenv:lint]
skip_install = true
deps =
    ruff
commands =
    ruff check src tests
    ruff format --check src tests

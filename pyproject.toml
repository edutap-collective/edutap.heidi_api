[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.heidi_api"
# 0.1.1 rather than releasing 0.1.0 to PyPI, for the same reason edutap.data_models
# went to 0.2.2 and edutap.observability_settings to 0.1.3: the tag `v0.1.0` points at
# the commit *before* the release workflow existed. A GitHub Release on it fires the
# event and finds no workflow at that ref, so nothing runs. Moving the tag was the
# alternative and is worse -- consumers already fetch it as a git reference, and a tag
# that changes under them is the kind of thing nobody reconstructs later.
#
# From here one version means one tag means one commit.
version = "0.1.1"
description = "Pythonic async client for the HEIDI Cloud Service API"
readme = "README.md"
requires-python = ">=3.12"
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
# No `License ::` classifier: `license` above is a PEP 639 SPDX expression, and the
# two together are rejected by the build backend rather than merely redundant.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.4",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pdbp",
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.6",
    "ty",
]
docs = [
    "myst-parser",
    "sphinx>=8",
]

[project.urls]
Source = "https://github.com/edutap-collective/edutap.heidi_api"
Issues = "https://github.com/edutap-collective/edutap.heidi_api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: talks to the live HEIDI API, needs credentials",
    "drift: fetches the live OpenAPI spec over the network",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

[tool.ty.environment]
root = ["./src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edutap.heidi_api"
version = "0.1.0"
description = "Pythonic async client for the HEIDI Cloud Service API"
readme = "README.md"
requires-python = ">=3.12"
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
]
dependencies = [
    "anyio>=4.4",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pdbp",
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.6",
    "ty",
]
docs = [
    "myst-parser",
    "sphinx>=8",
]

[project.urls]
Source = "https://github.com/edutap-eu/edutap.heidi_api"

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: talks to the live HEIDI API, needs credentials",
    "drift: fetches the live OpenAPI spec over the network",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

[tool.ty.environment]
root = ["./src"]
